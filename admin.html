<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Pani Puri Wala</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f4; padding: 15px; margin: 0; }
  .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1 { text-align: center; color: #572511; font-size: 24px; margin-bottom: 20px; }
  .field { margin-bottom: 15px; }
  label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 15px; background: #218548; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  .status { margin-top: 15px; padding: 10px; text-align: center; border-radius: 8px; font-weight: bold; display: none; }
  .success { background: #d4edda; color: #155724; display: block; }
  .error { background: #f8d7da; color: #721c24; display: block; }
  .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; margin-bottom: 15px; background: #fafafa; position: relative; }
  .card h3 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
  .remove-btn { background: #e74c3c; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; width: auto; margin: 0; }
  .add-btn { background: #ed812d; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin-bottom: 15px; }
  .img-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; margin-top: 5px; display: none; }
  .file-input { padding: 8px; }
  .note { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>Admin Panel</h1>
  
  <div class="field">
    <label>GitHub Token (Private)</label>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxx">
  </div>

  <hr style="margin: 20px 0; border: 1px solid #eee;">

  <div class="field">
    <label>Shop Status</label>
    <select id="shopStatus">
      <option value="true">🟢 Shop Open (Aaj khula hai)</option>
      <option value="false">🔴 Shop Closed (Today is holiday)</option>
    </select>
  </div>

  <div id="itemsContainer"></div>

  <button class="add-btn" onclick="addNewItem()">＋ Add New Item</button>

  <button onclick="saveData()">Update Live App</button>
  <div id="statusMsg" class="status"></div>
</div>

<script>
  const GITHUB_USERNAME = "Shaikmuzammil22";
  const REPO_NAME = "Pani-puri";
  const FILE_PATH = "data.json";
  const BRANCH = "main";
  const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

  let menuItems = [];

  window.onload = async () => {
    try {
      const res = await fetch("https://raw.githubusercontent.com/" + GITHUB_USERNAME + "/" + REPO_NAME + "/" + BRANCH + "/data.json?t=" + Date.now());
      const data = await res.json();
      document.getElementById("shopStatus").value = data.shopOpen ? "true" : "false";
      menuItems = data.menu || [];
      renderItems();
    } catch(e) { 
      console.log("Data load failed", e); 
      menuItems = [];
      renderItems();
    }
  };

  function renderItems() {
    const container = document.getElementById("itemsContainer");
    container.innerHTML = menuItems.map((item, i) => `
      <div class="card" data-index="${i}">
        <h3>Item ${i + 1} ${item.name ? '- ' + item.name : ''}
          <button class="remove-btn" onclick="removeItem(${i})">✕ Remove</button>
        </h3>
        <div class="field"><label>Item Name</label>
          <input type="text" class="item-name" value="${escapeHtml(item.name || '')}" placeholder="e.g. Pani Puri">
        </div>
        <div class="field"><label>Description</label>
          <input type="text" class="item-desc" value="${escapeHtml(item.description || '')}" placeholder="e.g. Fresh and spicy">
        </div>
        <div class="field"><label>Price (₹) - (0 karein toh Out of Stock)</label>
          <input type="number" class="item-price" value="${item.price || 0}">
        </div>
        <div class="field"><label>Photo (Gallery se choose karein)</label>
          <input type="file" accept="image/*" class="file-input" onchange="handleImageUpload(event, ${i})">
          <div class="note">Ya Photo URL daalein:</div>
          <input type="text" class="item-img-url" value="${escapeHtml(item.imageUrl || '')}" placeholder="https://...">
          <img class="img-preview" id="preview-${i}" src="${item.imageUrl || ''}" style="${item.imageUrl ? 'display:block' : ''}">
        </div>
      </div>
    `).join("");
  }

  function escapeHtml(str) { return (str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  function addNewItem() {
    menuItems.push({
      id: "item-" + Date.now(),
      name: "",
      description: "",
      price: 0,
      imageUrl: ""
    });
    renderItems();
  }

  function removeItem(index) {
    if(confirm("Is item ko delete karein?")) {
      menuItems.splice(index, 1);
      renderItems();
    }
  }

  async function handleImageUpload(event, index) {
    const file = event.target.files[0];
    if(!file) return;
    
    const token = document.getElementById("githubToken").value.trim();
    if(!token) { alert("Pehle GitHub Token daalein (photo upload ke liye zaroori hai)"); return; }

    const preview = document.getElementById("preview-" + index);
    preview.style.display = "block";
    preview.src = URL.createObjectURL(file);

    try {
      const base64 = await fileToBase64(file);
      const ext = file.name.split('.').pop().toLowerCase();
      const fileName = `images/item-${Date.now()}.${ext}`;
      
      // Upload image to GitHub repo
      const uploadUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${fileName}`;
      
      // Check if file exists (rare case)
      let sha = null;
      try {
        const check = await fetch(uploadUrl, { headers: { "Authorization": `token ${token}` } });
        if(check.ok) { const info = await check.json(); sha = info.sha; }
      } catch(e) {}

      const body = { message: "Admin: Upload item image", content: base64, branch: BRANCH };
      if(sha) body.sha = sha;

      const res = await fetch(uploadUrl, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if(res.ok) {
        const imageUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/${BRANCH}/${fileName}`;
        document.querySelectorAll(".item-img-url")[index].value = imageUrl;
        menuItems[index].imageUrl = imageUrl;
        alert("✅ Photo upload ho gayi!");
      } else {
        alert("❌ Photo upload fail. Token check karein.");
      }
    } catch(e) {
      alert("❌ Upload error: " + e.message);
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function saveData() {
    const token = document.getElementById("githubToken").value.trim();
    if(!token) return showMsg("GitHub Token daalna zaroori hai!", "error");

    // Read all fields from DOM
    const cards = document.querySelectorAll(".card");
    cards.forEach((card, i) => {
      menuItems[i].name = card.querySelector(".item-name").value;
      menuItems[i].description = card.querySelector(".item-desc").value;
      menuItems[i].price = Number(card.querySelector(".item-price").value);
      menuItems[i].imageUrl = card.querySelector(".item-img-url").value;
      if(!menuItems[i].id) menuItems[i].id = "item-" + Date.now() + "-" + i;
    });

    const isShopOpen = document.getElementById("shopStatus").value === "true";
    
    const updatedData = {
      "shopOpen": isShopOpen,
      "shopClosedMessage": "🚫 Aaj shop band hai! (Today is holiday)",
      "menu": menuItems
    };

    try {
      const getRes = await fetch(API_URL, { headers: { "Authorization": `token ${token}` } });
      const fileInfo = await getRes.json();
      if(fileInfo.message === "Not Found") return showMsg("Token galat hai ya file nahi mili.", "error");
      
      const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(updatedData, null, 2))));

      const putRes = await fetch(API_URL, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Admin: Menu updated", content: contentEncoded, sha: fileInfo.sha, branch: BRANCH })
      });

      if(putRes.ok) { showMsg("✅ Success! App live update ho gaya hai.", "success"); }
      else { showMsg("❌ Error: Update fail ho gaya. Token check karein.", "error"); }
    } catch(e) { showMsg("❌ Network Error.", "error"); }
  }

  function showMsg(msg, type) {
    const el = document.getElementById("statusMsg");
    el.textContent = msg;
    el.className = "status " + type;
    setTimeout(() => el.className = "status", 4000);
  }
</script>
</body>
</html>
