<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Admin - Pani Puri Wala</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3a1506;
    --gold: #d4af37;
    --gold-hover: #b38b22;
    --green: #218548;
    --green-hover: #196b38;
    --danger: #e74c3c;
    --bg: #f4f6f9;
    --card-bg: rgba(255, 255, 255, 0.95);
    --text: #2e2119;
    --text-light: #75695f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { 
    font-family: 'Poppins', sans-serif; 
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    background-attachment: fixed;
    color: var(--text); 
    padding: 20px 15px; 
    min-height: 100vh;
  }

  .container { 
    max-width: 650px; 
    margin: auto; 
    background: var(--card-bg); 
    backdrop-filter: blur(10px);
    padding: 30px; 
    border-radius: 20px; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.08), 0 5px 15px rgba(0,0,0,0.03); 
    border: 1px solid rgba(255,255,255,0.5);
    animation: fadeUp 0.6s ease-out forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 { 
    text-align: center; 
    color: var(--primary); 
    font-size: 26px; 
    font-weight: 700;
    margin-bottom: 25px; 
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    letter-spacing: 0.5px;
  }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 25px 0 15px 0;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .field { margin-bottom: 18px; position: relative; }
  
  label { 
    display: block; 
    font-weight: 500; 
    margin-bottom: 8px; 
    font-size: 13px; 
    color: var(--primary);
  }

  input, select { 
    width: 100%; 
    padding: 14px 15px; 
    border: 1.5px solid #e0e0e0; 
    border-radius: 12px; 
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: #fafafa;
    transition: all 0.3s ease;
  }

  input:focus, select:focus {
    border-color: var(--gold);
    background: #fff;
    outline: none;
    box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
    transform: translateY(-2px);
  }

  /* Buttons */
  button { 
    width: 100%; 
    padding: 16px; 
    background: var(--green); 
    color: white; 
    border: none; 
    border-radius: 12px; 
    font-size: 15px; 
    font-weight: 600; 
    font-family: 'Poppins', sans-serif;
    cursor: pointer; 
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(33, 133, 72, 0.2);
  }

  button:hover { background: var(--green-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(33, 133, 72, 0.3); }
  button:active { transform: translateY(0); }

  .add-btn {
    background: linear-gradient(135deg, #ed812d, #d96a1a);
    box-shadow: 0 4px 15px rgba(237, 129, 45, 0.2);
    margin-bottom: 15px;
  }
  .add-btn:hover { background: linear-gradient(135deg, #d96a1a, #c45c12); box-shadow: 0 6px 20px rgba(237, 129, 45, 0.3); }

  /* Status Message */
  .status { 
    margin-top: 15px; 
    padding: 12px; 
    text-align: center; 
    border-radius: 12px; 
    font-weight: 600; 
    font-size: 14px;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.4s ease;
    display: none;
  }
  .status.show { opacity: 1; transform: translateY(0); display: block; }
  .success { background: #e3f9e5; color: #1b7a2d; border: 1px solid #bdf0c4; }
  .error { background: #fce8e6; color: #c5221f; border: 1px solid #f7c5c2; }

  /* Item Cards */
  .card { 
    border: 1px solid #eee; 
    padding: 20px; 
    border-radius: 16px; 
    margin-bottom: 20px; 
    background: #fff; 
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    animation: slideIn 0.4s ease-out forwards;
  }
  .card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.06); border-color: #e8e8e8; transform: translateY(-2px); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-15px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 12px;
    border-bottom: 1px dashed #eee;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    background: var(--gold);
    color: var(--primary);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 700;
  }

  .actions { display: flex; gap: 6px; }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    padding: 0;
  }

  .move-btn { background: #f0f0f0; color: var(--primary); }
  .move-btn:hover { background: var(--primary); color: #fff; }
  .move-btn:disabled { background: #f9f9f9; color: #ccc; cursor: not-allowed; box-shadow: none; }

  .remove-btn { background: #fdeaea; color: var(--danger); }
  .remove-btn:hover { background: var(--danger); color: #fff; }

  /* Image Upload Area */
  .upload-area {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .file-input-wrapper {
    position: relative;
    overflow: hidden;
    display: inline-block;
    width: 100%;
  }

  .file-input-wrapper input[type=file] {
    font-size: 100px;
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    cursor: pointer;
  }

  .file-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #f8f9fa;
    border: 1.5px dashed #ccc;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    transition: 0.3s;
  }
  .file-input-wrapper:hover .file-label { background: #f1f3f5; border-color: var(--gold); color: var(--gold); }

  .img-preview { 
    width: 90px; 
    height: 90px; 
    object-fit: cover; 
    border-radius: 12px; 
    border: 2px solid #eee; 
    margin-top: 8px; 
    display: none; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
  }
  .img-preview:hover { transform: scale(1.05); border-color: var(--gold); }

  .upload-status { font-size: 12px; font-weight: 600; margin-top: 5px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>👑 Premium Admin</h1>
  
  <div class="field">
    <label>GitHub Token (Private)</label>
    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxx">
  </div>

  <div class="field">
    <label>Shop Status</label>
    <select id="shopStatus">
      <option value="true">🟢 Shop Open (Aaj khula hai)</option>
      <option value="false">🔴 Shop Closed (Today is holiday)</option>
    </select>
  </div>

  <div class="section-title">Menu Items</div>

  <div id="itemsContainer"></div>

  <button class="add-btn" onclick="addNewItem()">＋ Add New Item</button>
  <button onclick="saveData()">🚀 Update Live App</button>
  <div id="statusMsg" class="status"></div>
</div>

<script>
  const GITHUB_USERNAME = "Shaikmuzammil22";
  const REPO_NAME = "Pani-puri";
  const FILE_PATH = "data.json";
  const BRANCH = "main";
  const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

  let menuItems = [];

  // Load Data On Start
  window.onload = async () => {
    try {
      const res = await fetch("https://raw.githubusercontent.com/" + GITHUB_USERNAME + "/" + REPO_NAME + "/" + BRANCH + "/data.json?t=" + Date.now());
      const data = await res.json();
      document.getElementById("shopStatus").value = data.shopOpen ? "true" : "false";
      
      menuItems = (data.menu || []).map(m => ({
        id: m.id || "item-" + Date.now() + "-" + Math.random(),
        name: m.name || "",
        description: m.description || "",
        price: m.price || 0,
        imageUrl: m.imageUrl || ""
      }));
      renderItems();
    } catch(e) { 
      console.log("Data load failed", e); 
      menuItems = [];
      renderItems();
    }
  };

  // Render UI
  function renderItems() {
    const container = document.getElementById("itemsContainer");
    if(menuItems.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-light); font-size:14px;">Koi item nahi hai. Add New Item par click karein.</div>`;
      return;
    }

    container.innerHTML = menuItems.map((item, i) => {
      const isFirst = i === 0;
      const isLast = i === menuItems.length - 1;
      
      return `
      <div class="card" data-index="${i}">
        <div class="card-header">
          <div class="card-title">
            <span class="badge">#${i + 1}</span> 
            ${item.name ? escapeHtml(item.name) : 'New Item'}
          </div>
          <div class="actions">
            <button class="icon-btn move-btn" onclick="moveItem(${i}, -1)" ${isFirst ? 'disabled' : ''} title="Move Up">⬆</button>
            <button class="icon-btn move-btn" onclick="moveItem(${i}, 1)" ${isLast ? 'disabled' : ''} title="Move Down">⬇</button>
            <button class="icon-btn remove-btn" onclick="removeItem(${i})" title="Remove">✕</button>
          </div>
        </div>

        <div class="field"><label>Item Name</label>
          <input type="text" class="item-name" value="${escapeHtml(item.name)}" placeholder="e.g. Pani Puri">
        </div>

        <div class="field"><label>Description</label>
          <input type="text" class="item-desc" value="${escapeHtml(item.description)}" placeholder="e.g. Fresh and spicy">
        </div>

        <div class="field"><label>Price (₹) - (0 = Out of Stock)</label>
          <input type="number" class="item-price" value="${item.price}">
        </div>

        <div class="field">
          <label>Photo (Gallery se choose karein)</label>
          <div class="upload-area">
            <div class="file-input-wrapper">
              <input type="file" accept="image/*" onchange="handleImageUpload(event, ${i})">
              <div class="file-label">📁 Choose Photo from Gallery</div>
            </div>
            <div class="upload-status" id="upload-status-${i}"></div>
            
            <div style="font-size:12px; color:var(--text-light); margin-top:5px;">Ya Photo URL daalein:</div>
            <input type="text" class="item-img-url" value="${escapeHtml(item.imageUrl)}" placeholder="https://...">
            <img class="img-preview" id="preview-${i}" src="${item.imageUrl || ''}" style="${item.imageUrl ? 'display:block' : 'display:none'}">
          </div>
        </div>
      </div>
    `;
    }).join("");
  }

  function escapeHtml(str) { 
    return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); 
  }

  // Capture values before moving or updating
  function captureCurrentValues() {
    const cards = document.querySelectorAll(".card");
    cards.forEach((card, i) => {
      if (!menuItems[i]) return;
      menuItems[i].name = card.querySelector(".item-name").value.trim();
      menuItems[i].description = card.querySelector(".item-desc").value.trim();
      menuItems[i].price = Number(card.querySelector(".item-price").value) || 0;
      menuItems[i].imageUrl = card.querySelector(".item-img-url").value.trim();
    });
  }

  // Move Up / Down
  function moveItem(index, direction) {
    captureCurrentValues();
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= menuItems.length) return;
    
    const temp = menuItems[index];
    menuItems[index] = menuItems[newIndex];
    menuItems[newIndex] = temp;
    
    renderItems();
    
    // Auto scroll to moved item
    setTimeout(() => {
      const el = document.querySelector(`.card[data-index="${newIndex}"]`);
      if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }

  // Add Item
  function addNewItem() {
    captureCurrentValues();
    menuItems.push({
      id: "item-" + Date.now() + "-" + Math.floor(Math.random()*1000),
      name: "",
      description: "",
      price: 0,
      imageUrl: ""
    });
    renderItems();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  // Remove Item
  function removeItem(index) {
    if(confirm("Kya aap sach mein is item ko delete karna chahte hain?")) {
      captureCurrentValues();
      menuItems.splice(index, 1);
      renderItems();
    }
  }

  // Handle Photo Upload to GitHub
  async function handleImageUpload(event, index) {
    const file = event.target.files[0];
    if(!file) return;
    
    const token = document.getElementById("githubToken").value.trim();
    if(!token) { alert("Pehle GitHub Token daalein (photo upload ke liye zaroori hai)"); return; }

    if(file.size > 5 * 1024 * 1024) {
      alert("Photo 5MB se choti honi chahiye!");
      return;
    }

    const preview = document.getElementById("preview-" + index);
    const statusEl = document.getElementById("upload-status-" + index);
    
    preview.style.display = "block";
    preview.src = URL.createObjectURL(file);
    
    statusEl.style.display = "block";
    statusEl.style.color = "#ed812d";
    statusEl.textContent = "⏳ Uploading to GitHub...";

    try {
      const base64 = await fileToBase64(file);
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const fileName = `images/item-${Date.now()}.${ext}`;
      
      const uploadUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${fileName}`;

      const res = await fetch(uploadUrl, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ 
          message: "Admin: Uploaded new item image", 
          content: base64, 
          branch: BRANCH 
        })
      });

      if(res.ok) {
        const imageUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/${BRANCH}/${fileName}`;
        document.querySelectorAll(".item-img-url")[index].value = imageUrl;
        menuItems[index].imageUrl = imageUrl;
        statusEl.style.color = "#218548";
        statusEl.textContent = "✅ Photo upload ho gayi!";
        setTimeout(() => { statusEl.style.display = "none"; }, 3000);
      } else {
        const errData = await res.json();
        statusEl.style.color = "#e74c3c";
        statusEl.textContent = "❌ Upload fail: " + (errData.message || "Token check karein");
        alert("❌ Photo upload fail. Token permissions check karein.");
      }
    } catch(e) {
      statusEl.style.color = "#e74c3c";
      statusEl.textContent = "❌ Upload error";
      alert("❌ Upload error: " + e.message);
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Save to GitHub
  async function saveData() {
    const token = document.getElementById("githubToken").value.trim();
    if(!token) return showMsg("GitHub Token daalna zaroori hai!", "error");

    const cards = document.querySelectorAll(".card");
    if(cards.length !== menuItems.length) return showMsg("Page reload karein, kuch error aaya hai.", "error");

    cards.forEach((card, i) => {
      menuItems[i].name = card.querySelector(".item-name").value.trim();
      menuItems[i].description = card.querySelector(".item-desc").value.trim();
      menuItems[i].price = Number(card.querySelector(".item-price").value) || 0;
      menuItems[i].imageUrl = card.querySelector(".item-img-url").value.trim();
    });

    const isShopOpen = document.getElementById("shopStatus").value === "true";
    
    const updatedData = {
      "shopOpen": isShopOpen,
      "shopClosedMessage": "🚫 Aaj shop band hai! (Today is holiday)",
      "menu": menuItems
    };

    showMsg("⏳ Updating Live App...", "success");

    try {
      const getRes = await fetch(API_URL, { headers: { "Authorization": `token ${token}` } });
      const fileInfo = await getRes.json();
      
      if(fileInfo.message === "Not Found") return showMsg("Token galat hai ya data.json nahi mili.", "error");
      if(!fileInfo.sha) return showMsg("Token permissions check karein (repo scope chahiye).", "error");
      
      const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(updatedData, null, 2))));

      const putRes = await fetch(API_URL, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Admin: Menu updated", content: contentEncoded, sha: fileInfo.sha, branch: BRANCH })
      });

      if(putRes.ok) { 
        showMsg("✅ Success! App live update ho gaya hai.", "success"); 
      } else { 
        showMsg("❌ Error: Update fail ho gaya. Token check karein.", "error"); 
      }
    } catch(e) { 
      showMsg("❌ Network Error: " + e.message, "error"); 
    }
  }

  function showMsg(msg, type) {
    const el = document.getElementById("statusMsg");
    el.textContent = msg;
    el.className = "status show " + type;
    setTimeout(() => el.className = "status " + type, 5000);
  }
</script>
</body>
</html>
