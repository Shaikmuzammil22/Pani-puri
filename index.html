
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pani Puri Wala</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8ed;
      color: #30251e;
    }
    header {
      padding: 28px 16px;
      text-align: center;
      background: #a93618;
      color: white;
    }
    header h1 { margin: 0 0 8px; }
    main { max-width: 850px; margin: auto; padding: 16px; }
    .notice, .offer, .item {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px #0000000c;
    }
    .offer { border-left: 5px solid #e6a21a; }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
    }
    .price { font-size: 20px; font-weight: bold; color: #a93618; }
    .muted { color: #74675e; }
    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: #a93618;
      color: white;
      font-weight: bold;
    }
    #status { margin: 12px 0; }
  </style>
</head>
<body>
  <header>
    <h1 id="shopName">Pani Puri Wala</h1>
    <p>Fresh taste, happy moments!</p>
  </header>

  <main>
    <button id="refresh">Refresh menu</button>
    <p id="status" role="status">Loading menu...</p>

    <section class="notice">
      <h3>📢 Notice</h3>
      <p id="notice">Loading...</p>
    </section>

    <section class="offer">
      <h3 id="offerTitle">Special Offer</h3>
      <p id="offerText">Loading...</p>
    </section>

    <h2>Our Menu</h2>
    <section id="menu" class="menu"></section>
  </main>

  <script>
    const DATA_URL =
      "https://raw.githubusercontent.com/Shaikmuzammil22/Pani-puri/refs/heads/main/data.json";

    async function loadMenu() {
      const status = document.getElementById("status");
      status.textContent = "Loading latest menu...";

      try {
        const response = await fetch(
          DATA_URL + "?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) throw new Error("JSON load failed");

        const data = await response.json();

        document.getElementById("shopName").textContent =
          data.shopName || "Pani Puri Wala";

        document.getElementById("notice").textContent =
          data.notice || "Welcome!";

        document.getElementById("offerTitle").textContent =
          data.offerTitle || "Special Offer";

        document.getElementById("offerText").textContent =
          data.offerText || "";

        const menu = document.getElementById("menu");
        menu.replaceChildren();

        (data.menu || []).filter(item => item.available !== false)
          .forEach(item => {
            const card = document.createElement("article");
            card.className = "item";

            if (item.imageUrl) {
              const img = document.createElement("img");
              img.src = item.imageUrl;
              img.alt = item.name || "Menu item";
              img.loading = "lazy";
              img.onerror = () => img.remove();
              card.appendChild(img);
            }

            const name = document.createElement("h3");
            name.textContent = item.name || "Menu item";
            card.appendChild(name);

            const desc = document.createElement("p");
            desc.className = "muted";
            desc.textContent = item.description || "";
            card.appendChild(desc);

            const price = document.createElement("p");
            price.className = "price";
            price.textContent = "₹" + Number(item.price || 0);
            card.appendChild(price);

            menu.appendChild(card);
          });

        status.textContent = "Menu updated successfully.";
      } catch (error) {
        status.textContent =
          "Menu load nahi hua. data.json URL aur JSON format check karo.";
      }
    }

    document.getElementById("refresh").addEventListener("click", loadMenu);
    loadMenu();
  </script>
</body>
</html>
